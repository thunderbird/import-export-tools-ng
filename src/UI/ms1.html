<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,minimum-scale=1">
    <title>Multi Select JS - Demos</title>
    <!-- Include the Multi Select stylesheet -->
    <link rel="stylesheet" href="./MultiSelect.css">
    <style>
        * {
                box-sizing: border-box;
                font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                font-size: 16px;
            }
    </style>

</head>

<body>
    <select id="options" name="options" data-placeholder="Options" data-max="1" data-list-all2="false" data-width="200px" data-select-all="false"  data-search="false" multiple data-multi-select>
    <!-- <select id="options" name="options" data-placeholder="Options" multiple data-multi-select> -->

        <option value="Attachments" selected>Attachments</option>
        <option value="Subfolders">Subfolders</option>
        <option value="Index">Index</option>
    </select>

     <label for="fruits">Fruits</label>
            <select id="fruits" name="fruits" data-placeholder="Select fruits" multiple data-multi-select>
                <option value="Apple">Apple</option>
                <option value="Banana">Banana</option>
                <option value="Blackberry">Blackberry</option>
                <option value="Blueberry">Blueberry</option>
                <option value="Cherry">Cherry</option>
                <option value="Cranberry">Cranberry</option>
                <option value="Grapes">Grapes</option>
                <option value="Kiwi">Kiwi</option>
                <option value="Mango">Mango</option>
                <option value="Orange">Orange</option>
                <option value="Peach">Peach</option>
                <option value="Pear">Pear</option>
                <option value="Pineapple">Pineapple</option>
                <option value="Raspberry">Raspberry</option>
                <option value="Strawberry">Strawberry</option>
                <option value="Watermelon">Watermelon</option>
            </select>




</body>
<script src="./MultiSelect2.js"></script>

</html>
